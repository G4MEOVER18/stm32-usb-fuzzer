; PlatformIO Project Configuration – stm32-usb-fuzzer
; STM32F103C8T6 (Blue Pill) USB-Descriptor-Fuzzer. PlatformIO lädt ARM-GCC
; (toolchain-gccarmnoneeabi) und die STM32Cube-HAL automatisch.
;
; Build:  pio run   ·   Flash: pio run -t upload (ST-Link)   ·   Monitor: 115200

[platformio]
; Quellen liegen in Core/ und USB_DEVICE/ (kein src/-Ordner)
src_dir = .

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = stm32cube
monitor_speed = 115200

build_flags =
    -ICore/Inc
    -IUSB_DEVICE/App
    -IUSB_DEVICE/Target
    -DSTM32F103xB
; Projekteigene Quellen (HAL/CMSIS/Startup liefert das stm32cube-Framework)
build_src_filter =
    +<Core/Src/>
    +<USB_DEVICE/>
